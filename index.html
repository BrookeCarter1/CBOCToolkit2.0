<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBOC Toolkit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8; color: #1a2b3c; line-height: 1.5; min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #003e73 0%, #0a5ca8 100%);
    color: #fff; padding: 32px 24px 28px; box-shadow: 0 2px 16px rgba(0,0,0,0.12);
  }
  .header-inner { max-width: 1120px; margin: 0 auto; }
  header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.4px; }
  header p { margin-top: 6px; opacity: 0.9; font-size: 0.95rem; }

  .search-wrap { max-width: 1120px; margin: 24px auto 0; padding: 0 24px; }
  #search {
    width: 100%; padding: 14px 18px; font-size: 1rem; border: 1px solid #cfdbe6;
    border-radius: 12px; outline: none; background: #fff; transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search:focus { border-color: #0a5ca8; box-shadow: 0 0 0 3px rgba(10,92,168,0.14); }

  main { max-width: 1120px; margin: 0 auto; padding: 26px 24px 60px; }

  .section-title {
    font-size: 1.2rem; font-weight: 700; color: #003e73; margin: 28px 0 14px;
    display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid #d6e2ee;
  }
  .section-title .em { font-size: 1.25rem; }
  .section-title .count {
    font-size: 0.75rem; font-weight: 600; background: #e1ecf7; color: #0a5ca8;
    padding: 2px 10px; border-radius: 12px; margin-left: auto;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 14px; }
  .card {
    display: flex; align-items: center; gap: 13px; background: #fff; border: 1px solid #e6edf4;
    border-radius: 13px; padding: 15px 16px; text-decoration: none; color: inherit;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,62,115,0.12); border-color: #b9d2e8; }
  .card .icon {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 11px; background: #eef4fb;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .card .name { font-weight: 600; font-size: 0.94rem; color: #1a2b3c; }

  /* accent per section */
  .s-pharm .icon { background: #eaf6ef; }
  .s-nursing .icon { background: #fbf4e2; }
  .s-howto .icon { background: #f0ebfb; }
  .s-guide .icon { background: #e7f0fb; }

  .badge-guide {
    display: inline-block; font-size: 0.6rem; font-weight: 700; color: #6b46c1;
    background: #f0ebfb; padding: 1px 6px; border-radius: 6px; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.3px;
  }

  .no-results { text-align: center; color: #6b7c8d; padding: 40px; font-size: 1.05rem; display: none; }
  footer { text-align: center; color: #8494a3; font-size: 0.8rem; padding: 20px; }

  @media (max-width: 500px) { header h1 { font-size: 1.55rem; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>CBOC Toolkit</h1>
      <p>Tools, reports, directories, and how-to guides — all in one place.</p>
    </div>
  </header>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍  Search tools and guides…" autocomplete="off">
  </div>

  <main id="content"></main>
  <div class="no-results" id="noResults">Nothing matches your search.</div>

  <footer>CBOC Toolkit · Links open in a new tab</footer>

        { name: "Nurse Care Manager Directory", icon: "👩‍⚕️", url: "https://brookecarter1.github.io/NCMDirectory-/" },
        { name: "Tips and Tricks", icon: "💡", url: "https://brookecarter1.github.io/TipsandTricks/" },
        { name: "How to Send a RI-COH Letter", icon: "✉️", url: "https://brookecarter1.github.io/RI-COHLetterInstructions/" },
        { name: "Capturing Secure Message Workload Credit", icon: "📊", url: "https://brookecarter1.github.io/SecureMessagingWorkloadCredit/" }
      ]
    }
  ];

  const content = document.getElementById('content');

  function render(filter = "") {
    content.innerHTML = "";
    const f = filter.trim().toLowerCase();
    let anyShown = false;

    data.forEach(sec => {
      const matches = sec.links.filter(l => l.name.toLowerCase().includes(f));
      if (!matches.length) return;
      anyShown = true;

      const title = document.createElement('div');
      title.className = 'section-title';
      title.innerHTML = '<span class="em">' + sec.em + '</span> ' + sec.section +
        ' <span class="count">' + matches.length + '</span>';
      content.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'grid ' + sec.cls;
      matches.forEach(l => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.innerHTML = '<span class="icon">' + l.icon + '</span><span class="name">' + l.name + '</span>';
        grid.appendChild(a);
      });
      content.appendChild(grid);
    });

    document.getElementById('noResults').style.display = anyShown ? 'none' : 'block';
  }

  document.getElementById('search').addEventListener('input', e => render(e.target.value));
  render();
</script>
</body>
</html>

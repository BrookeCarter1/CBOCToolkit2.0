<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBOC Toolkit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8; color: #1a2b3c; line-height: 1.5; min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #003e73 0%, #0a5ca8 100%);
    color: #fff; padding: 30px 24px 26px; box-shadow: 0 2px 16px rgba(0,0,0,0.12);
  }
  .header-inner { max-width: 1120px; margin: 0 auto; }
  header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.4px; }
  header p { margin-top: 6px; opacity: 0.9; font-size: 0.95rem; }

  .controls { max-width: 1120px; margin: 22px auto 0; padding: 0 24px; }
  #search {
    width: 100%; padding: 14px 18px; font-size: 1rem; border: 1px solid #cfdbe6;
    border-radius: 12px; outline: none; background: #fff; transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search:focus { border-color: #0a5ca8; box-shadow: 0 0 0 3px rgba(10,92,168,0.14); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .filter {
    background: #fff; border: 1px solid #cfdbe6; color: #445; cursor: pointer;
    padding: 8px 16px; border-radius: 20px; font-size: 0.88rem; font-weight: 600;
    transition: all 0.15s; font-family: inherit;
  }
  .filter:hover { border-color: #0a5ca8; color: #0a5ca8; }
  .filter.active { background: #0a5ca8; color: #fff; border-color: #0a5ca8; }

  main { max-width: 1120px; margin: 0 auto; padding: 22px 24px 60px; }

  .section { margin-bottom: 6px; }
  .section-title {
    font-size: 1.15rem; font-weight: 700; color: #003e73; margin: 26px 0 14px;
    display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid #d6e2ee;
    cursor: pointer; user-select: none;
  }
  .section-title .em { font-size: 1.2rem; }
  .section-title .count {
    font-size: 0.75rem; font-weight: 600; background: #e1ecf7; color: #0a5ca8;
    padding: 2px 10px; border-radius: 12px;
  }
  .section-title .chev { margin-left: auto; font-size: 0.85rem; color: #8aa3bd; transition: transform 0.2s; }
  .section.collapsed .chev { transform: rotate(-90deg); }
  .section.collapsed .grid { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card {
    position: relative; display: flex; align-items: center; gap: 13px; background: #fff;
    border: 1px solid #e6edf4; border-radius: 13px; padding: 15px 40px 15px 16px; text-decoration: none;
    color: inherit; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,62,115,0.12); border-color: #b9d2e8; }
  .card .icon {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 11px; background: #eef4fb;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .card .name { font-weight: 600; font-size: 0.93rem; color: #1a2b3c; }
  .star {
    position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 4px; border-radius: 6px; color: #c7d3df;
    transition: color 0.15s, transform 0.15s; font-family: inherit;
  }
  .star:hover { transform: scale(1.25); color: #f0b429; }
  .star.on { color: #f0b429; }

  .mostused .section-title { color: #b8860b; border-bottom-color: #f0e0b8; }
  .mostused .card .icon { background: #fdf6e3; }
  .mostused-empty {
    background: #fffdf5; border: 1px dashed #e6d59a; border-radius: 12px; padding: 18px 20px;
    font-size: 0.9rem; color: #8a7530;
  }

  .no-results { text-align: center; color: #6b7c8d; padding: 40px; font-size: 1.05rem; display: none; }
  footer { text-align: center; color: #8494a3; font-size: 0.8rem; padding: 20px; }

  @media (max-width: 500px) { header h1 { font-size: 1.55rem; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>CBOC Toolkit</h1>
      <p>Tools, reports, directories, and how-to guides — all in one place.</p>
    </div>
  </header>

    <input type="text" id="search" placeholder="🔍  Search tools and guides…" autocomplete="off">
    <div class="filters" id="filters"></div>

  <div class="no-results" id="noResults">Nothing matches your search.</div>

  <footer>CBOC Toolkit · Links open in a new tab · ☆ Tap the star to pin to Most Used</footer>

  function toggleStar(url){

        { name: "How to Remove Note in CPRS", icon: "🗑️", url: "https://dvagov.sharepoint.com/:w:/r/sites/vasyracuseemrtipsandtricks/_layouts/15/Doc.aspx?sourcedoc=%7BD3996CA4-FD20-4D95-BD45-B1DC74B16AF3%7D&file=How%20to%20Remove%20Note%20in%20CPRS-NEW%201.docx&action=default&mobileredirect=true" },
        { name: "Telephone Encounter Tip Sheet", icon: "📞", url: "https://dvagov.sharepoint.com/sites/vasyracuseemrtipsandtricks/Useful%20Tips%20and%20Tricks/Forms/AllItems.aspx?id=%2Fsites%2Fvasyracuseemrtipsandtricks%2FUseful%20Tips%20and%20Tricks%2FTelephone%20Encounter%20Tip%20Sheet%20Addtional%20information%2Epdf&parent=%2Fsites%2Fvasyracuseemrtipsandtricks%2FUseful%20Tips%20and%20Tricks" },

    {

        { name: "How to Order In-Clinic Psych Meds", icon: "💉", url: "https://brookecarter1.github.io/Psychinjection/" },

        { name: "Daily Huddle Guide", icon: "👥", url: "https://brookecarter1.github.io/DailyHuddle/" },

      ]
    },
    {

      links: [
        { name: "Important Phone Numbers", icon: "☎️", url: "https://brookecarter1.github.io/ImportantPhoneNumbers/" },

        { name: "DAISY Nomination Form", icon: "🌼", url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Ixtf6a-r7kWCHberJRqzv2QtJdDozdtDkiFe_GKd4FpUMjVWSzNNTDNRUUk0UDFOUUJGT0FFRTFHMi4u" },
        { name: "PETALS Award Nomination Form", icon: "🌸", url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Ixtf6a-r7kWCHberJRqzv2QtJdDozdtDkiFe_GKd4FpUNTVOMlZGUUZZUEJNSFdUVDVNNUlDTjlTMC4u" },
        { name: "Syracuse VAMC Staff Shoutout", icon: "📣", url: "https://forms.cloud.microsoft/pages/responsepage.aspx?id=Ixtf6a-r7kWCHberJRqzv-FHgGfYmeZMtYEg4nfdKJxUQ0lEQUJaNVJYRzM4RERYMTUyTVBIRURESC4u" }
      ]
    }
  ];

  // flat lookup for Most Used
  const allLinks = {};
  data.forEach(s => s.links.forEach(l => allLinks[l.url] = l));

  const collapsed = new Set();

  const content = document.getElementById('content');

  function cardHTML(l){
    const on = starred.has(l.url) ? 'on' : '';
    const sym = starred.has(l.url) ? '★' : '☆';
    return '<a class="card" href="'+l.url+'" target="_blank" rel="noopener noreferrer">'+
      '<span class="icon">'+l.icon+'</span><span class="name">'+l.name+'</span>'+
      '<button class="star '+on+'" data-url="'+l.url.replace(/"/g,'&quot;')+'" title="Pin to Most Used">'+sym+'</button></a>';
  }

  function buildSection(sec, matches, extraClass){
    const wrap = document.createElement('div');
    wrap.className = 'section' + (collapsed.has(sec.section) ? ' collapsed' : '') + (extraClass ? ' '+extraClass : '');
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = '<span class="em">'+sec.em+'</span> '+sec.section+
      ' <span class="count">'+matches.length+'</span><span class="chev">▼</span>';
    title.addEventListener('click', () => {
      if (collapsed.has(sec.section)) collapsed.delete(sec.section); else collapsed.add(sec.section);
      render(document.getElementById('search').value);
    });
    wrap.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.innerHTML = matches.map(cardHTML).join('');
    wrap.appendChild(grid);
    return wrap;
  }

  function render(filter=""){
    content.innerHTML = "";
    const f = filter.trim().toLowerCase();
    let anyShown = false;

    // Most Used (always at top, respects search but not the category filter)
    const starredLinks = [...starred].map(u => allLinks[u]).filter(Boolean)
      .filter(l => l.name.toLowerCase().includes(f));
    if (starred.size){
      const sec = { section: "Most Used", em: "⭐" };
      if (starredLinks.length){
        content.appendChild(buildSection(sec, starredLinks, 'mostused'));
        anyShown = true;
      }
    } else if (f === "" && activeFilter === "all") {
      const wrap = document.createElement('div');
      wrap.className = 'section mostused';
      wrap.innerHTML = '<div class="section-title"><span class="em">⭐</span> Most Used <span class="chev">&nbsp;</span></div>'+
        '<div class="mostused-empty">Tap the ☆ star on any tile to pin your most-used links here.</div>';
      content.appendChild(wrap);
    }

    // Sections (respect category filter + search)
    data.forEach(sec => {
      if (activeFilter !== "all" && sec.cat !== activeFilter) return;
      const matches = sec.links.filter(l => l.name.toLowerCase().includes(f));
      if (!matches.length) return;
      anyShown = true;
      content.appendChild(buildSection(sec, matches));
    });

    document.getElementById('noResults').style.display = anyShown ? 'none' : 'block';

    // wire star buttons
    content.querySelectorAll('.star').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        toggleStar(btn.getAttribute('data-url'));
      });
    });
  }

  // build filter buttons
  const fEl = document.getElementById('filters');
  filters.forEach(fl => {
    const b = document.createElement('button');
    b.className = 'filter' + (fl.key === 'all' ? ' active' : '');
    b.textContent = fl.label;
    b.addEventListener('click', () => {
      activeFilter = fl.key;
      document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render(document.getElementById('search').value);
    });
    fEl.appendChild(b);
  });

  document.getElementById('search').addEventListener('input', e => render(e.target.value));
  render();
</script>
</body>
</html>

<title>CBOC Toolkit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; color: #1a2b3c; line-height: 1.5; min-height: 100vh; }
  header { background: linear-gradient(135deg, #003e73 0%, #0a5ca8 100%); color: #fff; padding: 30px 24px 26px; box-shadow: 0 2px 16px rgba(0,0,0,0.12); }
  .header-inner { max-width: 1120px; margin: 0 auto; }
  header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.4px; }
  header p { margin-top: 6px; opacity: 0.9; font-size: 0.95rem; }

  .controls { max-width: 1120px; margin: 22px auto 0; padding: 0 24px; }
  .modes { display: inline-flex; flex-wrap: wrap; background: #e2ebf3; border-radius: 12px; padding: 4px; margin-bottom: 14px; gap: 2px; }
  .mode { border: none; background: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.9rem; color: #56697c; padding: 9px 18px; border-radius: 9px; transition: all 0.15s; }
  .mode.active { background: #fff; color: #0a5ca8; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  #search { width: 100%; padding: 14px 18px; font-size: 1rem; border: 1px solid #cfdbe6; border-radius: 12px; outline: none; background: #fff; transition: border-color 0.2s, box-shadow 0.2s; }
  #search:focus { border-color: #0a5ca8; box-shadow: 0 0 0 3px rgba(10,92,168,0.14); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .filter { background: #fff; border: 1px solid #cfdbe6; color: #445; cursor: pointer; padding: 8px 16px; border-radius: 20px; font-size: 0.88rem; font-weight: 600; transition: all 0.15s; font-family: inherit; }
  .filter:hover { border-color: #0a5ca8; color: #0a5ca8; }
  .filter.active { background: #0a5ca8; color: #fff; border-color: #0a5ca8; }

  main { max-width: 1120px; margin: 0 auto; padding: 22px 24px 60px; }

  .section { margin-bottom: 6px; }
  .section-title { font-size: 1.15rem; font-weight: 700; color: #003e73; margin: 26px 0 14px; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid #d6e2ee; cursor: pointer; user-select: none; }
  .section-title .em { font-size: 1.2rem; }
  .section-title .count { font-size: 0.75rem; font-weight: 600; background: #e1ecf7; color: #0a5ca8; padding: 2px 10px; border-radius: 12px; }
  .section-title .chev { margin-left: auto; font-size: 0.85rem; color: #8aa3bd; transition: transform 0.2s; }
  .section.collapsed .chev { transform: rotate(-90deg); }
  .section.collapsed .grid { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { position: relative; display: flex; align-items: center; gap: 13px; background: #fff; border: 1px solid #e6edf4; border-radius: 13px; padding: 15px 40px 15px 16px; text-decoration: none; color: inherit; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,62,115,0.12); border-color: #b9d2e8; }
  .card .icon { flex-shrink: 0; width: 42px; height: 42px; border-radius: 11px; background: #eef4fb; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .card .name { font-weight: 600; font-size: 0.93rem; color: #1a2b3c; }
  .star { position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer; font-size: 1rem; line-height: 1; padding: 4px; border-radius: 6px; color: #c7d3df; transition: color 0.15s, transform 0.15s; font-family: inherit; }
  .star:hover { transform: scale(1.25); color: #f0b429; }
  .star.on { color: #f0b429; }

  .mostused .section-title { color: #b8860b; border-bottom-color: #f0e0b8; }
  .mostused .card .icon { background: #fdf6e3; }
  .mostused-empty { background: #fffdf5; border: 1px dashed #e6d59a; border-radius: 12px; padding: 18px 20px; font-size: 0.9rem; color: #8a7530; }

  .router-lead { font-size: 0.9rem; color: #6b7c8d; margin: 4px 0 16px; }
  .rrow { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e6edf4; border-radius: 13px; padding: 15px 18px; margin-bottom: 11px; text-decoration: none; color: inherit; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
  .rrow:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,62,115,0.12); border-color: #b9d2e8; }
  .rrow .ic { flex-shrink: 0; width: 46px; height: 46px; border-radius: 12px; background: #eef4fb; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .rrow .body { flex: 1; min-width: 0; }
  .rrow .want { font-weight: 700; font-size: 1rem; color: #1a2b3c; }
  .rrow .goes { font-size: 0.83rem; color: #0a5ca8; margin-top: 3px; }
  .rrow .goes .arrow { color: #8aa3bd; }
  .rrow .chev { color: #c7d3df; font-size: 1.2rem; flex-shrink: 0; }
  .rrow:hover .chev { color: #0a5ca8; }

  .cl-progress { background: #fff; border: 1px solid #e8eef4; border-radius: 14px; padding: 16px 20px; margin-bottom: 22px; display: flex; align-items: center; gap: 16px; }
  .cl-ring { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .cl-ring svg { transform: rotate(-90deg); }
  .cl-ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: #0a5ca8; }
  .cl-ptxt { flex: 1; }
  .cl-ptxt .big { font-weight: 700; color: #003e73; font-size: 1.02rem; }
  .cl-ptxt .small { font-size: 0.85rem; color: #6b7c8d; }
  .cl-reset { background: #fff; border: 1px solid #cfdbe6; color: #56697c; cursor: pointer; font-family: inherit; padding: 8px 14px; border-radius: 10px; font-size: 0.82rem; font-weight: 600; transition: all 0.15s; }
  .cl-reset:hover { border-color: #c53030; color: #c53030; }
  .cl-dateline { font-size: 0.88rem; color: #6b7c8d; margin-bottom: 14px; }
  .cl-section { background: #fff; border: 1px solid #e8eef4; border-radius: 14px; padding: 8px 20px 12px; margin-bottom: 16px; }
  .cl-section h2 { font-size: 1.05rem; color: #003e73; padding: 12px 0 10px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #eef1f4; margin-bottom: 6px; }
  .cl-section h2 .em { font-size: 1.2rem; }
  .cl-section h2 .cbadge { margin-left: auto; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 3px 9px; border-radius: 10px; }
  .cbadge.am { background: #eef7f1; color: #22543d; }
  .cbadge.day { background: #eef3fb; color: #0a5ca8; }
  .cbadge.pm { background: #f0ebfb; color: #6b46c1; }
  .cbadge.wk { background: #fff8e6; color: #7a5c00; }
  .cl-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 4px; cursor: pointer; border-radius: 8px; transition: background 0.12s; }
  .cl-item:hover { background: #f7fafd; }
  .cl-cb { width: 22px; height: 22px; border: 2px solid #c4d2e0; border-radius: 6px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; color: #fff; font-size: 0.85rem; }
  .cl-item.done .cl-cb { background: #2f855a; border-color: #2f855a; }
  .cl-item.done .cl-cb::after { content: "✓"; }
  .cl-txt { font-size: 0.95rem; color: #33465a; }
  .cl-item.done .cl-txt { color: #9aacbd; text-decoration: line-through; }
  .cl-txt .hint { display: block; font-size: 0.8rem; color: #8494a3; margin-top: 2px; text-decoration: none; }
  .cl-item.done .cl-txt .hint { color: #b8c4d0; }
  .cl-note { text-align: center; font-size: 0.82rem; color: #8494a3; margin-top: 8px; }

  .no-results { text-align: center; color: #6b7c8d; padding: 40px; font-size: 1.05rem; display: none; }
  footer { text-align: center; color: #8494a3; font-size: 0.8rem; padding: 20px; }

  @media (max-width: 500px) { header h1 { font-size: 1.55rem; } .grid { grid-template-columns: 1fr; } }
</style>

    { section: "Awards & Recognition", em: "🏆", cat: "awards", links: [
      { name: "VA Gratitude App", icon: "🙏", url: "https://apps.gov.powerapps.us/play/e/default-e95f1b23-abaf-45ee-821d-b7ab251ab3bf/a/a5260837-4abc-4a18-979c-25e40726ae8f?tenantId=e95f1b23-abaf-45ee-821d-b7ab251ab3bf&source=portal&skipAppMetadata=true" },
      { name: "I-CARE Nomination Form", icon: "💗", url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Ixtf6a-r7kWCHberJRqzvw5KhncS8SZGnXWDikbR-P9URFhFOUE5Q0hSSTJJWTVYRDZSQUFKUU5TWC4u" },
      { name: "DAISY Nomination Form", icon: "🌼", url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Ixtf6a-r7kWCHberJRqzv2QtJdDozdtDkiFe_GKd4FpUMjVWSzNNTDNRUUk0UDFOUUJGT0FFRTFHMi4u" },
      { name: "PETALS Award Nomination Form", icon: "🌸", url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Ixtf6a-r7kWCHberJRqzv2QtJdDozdtDkiFe_GKd4FpUNTVOMlZGUUZZUEJNSFdUVDVNNUlDTjlTMC4u" },
      { name: "Syracuse VAMC Staff Shoutout", icon: "📣", url: "https://forms.cloud.microsoft/pages/responsepage.aspx?id=Ixtf6a-r7kWCHberJRqzv-FHgGfYmeZMtYEg4nfdKJxUQ0lEQUJaNVJYRzM4RERYMTUyTVBIRURESC4u" }
    ]}
  ];

  var routes = [
    { want: "Order anticoagulation meds (DOAC / Afib)", dest: "Anticoag Request Guide", icon: "🩸", url: "https://brookecarter1.github.io/ACRequest/", keys: "doac dvt pe afib flutter blood thinner warfarin eliquis" },
    { want: "Place a non-formulary request", dest: "NF Request Guide", icon: "📋", url: "https://brookecarter1.github.io/NFGuide/", keys: "non formulary cfu criteria for use medication not listed" },
    { want: "Order in-clinic psych injections", dest: "Psych Injection Guide", icon: "💉", url: "https://brookecarter1.github.io/Psychinjection/", keys: "psych mental health injection abilify gui mail pharmacy" },
    { want: "Order a controlled substance", dest: "Controlled Substance Note Guide", icon: "🔒", url: "https://brookecarter1.github.io/NationalControlled/", keys: "opioid benzo stimulant pdmp uds narcotic" },
    { want: "Add a note template", dest: "How to Add a Template", icon: "📄", url: "https://brookecarter1.github.io/Template/", keys: "template cprs my templates boilerplate" },
    { want: "Send a mailed letter to a Veteran", dest: "Ricoh Letter Guide", icon: "✉️", url: "https://brookecarter1.github.io/RI-COHLetterInstructions/", keys: "ricoh planetpress mail letter print historical note" },
    { want: "Scan a document into VISTA", dest: "VISTA Scanning Instructions", icon: "🖨️", url: "https://brookecarter1.github.io/Scanning/", keys: "scan vista imaging document" },
    { want: "Print a clinic schedule from VISTA", dest: "VISTA Printing", icon: "📑", url: "https://brookecarter1.github.io/VistaPrintingg/", keys: "print schedule vista clinic app" },
    { want: "Get workload credit for a secure message", dest: "Secure Message Workload Guide", icon: "📊", url: "https://brookecarter1.github.io/SecureMessagingWorkloadCredit/", keys: "workload credit secure message cpt increment of time myhealthevet" },
    { want: "Do a post-discharge follow-up", dest: "2 Day Discharge Process", icon: "🏥", url: "https://brookecarter1.github.io/2DayDischargeProcess/", keys: "discharge dc follow up 2 day post discharge contact" },
    { want: "Scrub my schedule", dest: "Schedule Scrubbing Guide", icon: "🧽", url: "https://brookecarter1.github.io/Scrubbing/", keys: "scrub schedule new patient established rooming prep" },
    { want: "Run a daily huddle", dest: "Daily Huddle Guide", icon: "👥", url: "https://brookecarter1.github.io/DailyHuddle/", keys: "huddle pact team morning meeting" },
    { want: "Work my EQM / quality measures", dest: "EQM Management Guide", icon: "✅", url: "https://brookecarter1.github.io/eqm/", keys: "eqm quality measures a1c metrics screening outreach" },
    { want: "Manage the fax folder", dest: "Fax Folder Management", icon: "📠", url: "https://brookecarter1.github.io/FaxFolderManagement/", keys: "fax folder scan rename outside records labs" },
    { want: "Handle a community care consult / SEOC", dest: "Consult Guide", icon: "📑", url: "https://brookecarter1.github.io/ConsultGuide/", keys: "consult seoc community care authorization cpt referral" },
    { want: "Look up a medication", dest: "VA Formulary", icon: "📖", url: "https://www.va.gov/formularyadvisor/", keys: "formulary drug medication lookup search cfu" },
    { want: "Look up a Veteran's copay", dest: "VA Copay Rates", icon: "💵", url: "https://brookecarter1.github.io/VACopay/", keys: "copay cost rates priority group medication urgent" },
    { want: "Explain urgent care vs. ED coverage", dest: "UC & ED Coverage", icon: "🚑", url: "https://brookecarter1.github.io/UCandED/", keys: "urgent care emergency ed coverage copay notification" },
    { want: "Help a Veteran get dental insurance", dest: "VADIP Guide", icon: "🦷", url: "https://brookecarter1.github.io/VADIP/", keys: "dental vadip insurance delta metlife teeth" },
    { want: "Find a phone number", dest: "Important Phone Numbers", icon: "☎️", url: "https://brookecarter1.github.io/ImportantPhoneNumbers/", keys: "phone number crisis line pharmacy audiology billing contact" },
    { want: "Reach a clinical pharmacist", dest: "Clinical Pharmacy Directory", icon: "💊", url: "https://brookecarter1.github.io/ClinicalPharmDirectory/", keys: "pharmacy pharmacist directory anticoag pact who covers" },
    { want: "Reach a Nurse Care Manager", dest: "NCM Directory", icon: "👩‍⚕️", url: "https://brookecarter1.github.io/NCMDirectory-/", keys: "ncm nurse care manager surrogate specialty cardiology" },
    { want: "Recognize a coworker / submit an award", dest: "I-CARE Nomination Form", icon: "🏆", url: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Ixtf6a-r7kWCHberJRqzvw5KhncS8SZGnXWDikbR-P9URFhFOUE5Q0hSSTJJWTVYRDZSQUFKUU5TWC4u", keys: "award recognition daisy petals icare shoutout gratitude nominate" }
  ];

  var clSections = [
    { title: "Start of Day", em: "🌅", badge: "am", items: [
      { t: "Scrub tomorrow's schedule", h: "Verify visit types, labs ordered, records gathered" },
      { t: "Pull the discharge list", h: "Updated ~9:30 AM EST · Select All event types" },
      { t: "Complete post-discharge contacts", h: "Banner-named PACT member · Post Discharge Contact note" },
      { t: "Attend / run the daily huddle", h: "Staffing, high-risk Veterans, coordination, owners" },
      { t: "Check huddle planning tool & CAN scores", h: "Flag CAN over 95 for LST note" }
    ]},
    { title: "Throughout the Day", em: "🔄", badge: "day", items: [
      { t: "Check the fax folder (multiple times)", h: "Rename: Last name + Last 4 + doc type; scan/alert as needed" },
      { t: "Work CPRS alerts", h: "New telephone encounter note each time — not an addendum" },
      { t: "Respond to Secure Messages", h: "Save as CPRS note; capture workload credit / increment of time" },
      { t: "EQM outreach on due Veterans", h: "Validate before outreach; combine care gaps into one contact" },
      { t: "Address clinical reminders", h: "Resolve reminders that are due during encounters" }
    ]},
    { title: "End of Day", em: "🌆", badge: "pm", items: [
      { t: "Sign all open notes", h: "Nothing left unsigned" },
      { t: "Check out all encounters", h: "Confirm on the CPRS cover page" },
      { t: "Close out / hand off pending items", h: "Confirm owner for anything unresolved" }
    ]},
    { title: "Weekly", em: "📅", badge: "wk", items: [
      { t: "Review the EQM outlier list", h: "Once a week — review, validate, outreach cycle" }
    ]}
  ];
  var clTotal = 0;
  clSections.forEach(function(s){ clTotal += s.items.length; });
  function clKey(){ var d = new Date(); return 'cboc_checklist_' + d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
  var clState = store.get(clKey()) || {};

  var allLinks = {};
  data.forEach(function(s){ s.links.forEach(function(l){ allLinks[l.url] = l; }); });
  var collapsed = new Set();

  var content = document.getElementById('content');
  var searchEl = document.getElementById('search');
  var filtersEl = document.getElementById('filters');
  var noResults = document.getElementById('noResults');

  function esc(s){ return s.replace(/"/g, '&quot;'); }

  function cardHTML(l){
    var on = starred.has(l.url) ? 'on' : '';
    var sym = starred.has(l.url) ? '★' : '☆';
    return '<a class="card" href="'+l.url+'" target="_blank" rel="noopener noreferrer">'+
      '<span class="icon">'+l.icon+'</span><span class="name">'+l.name+'</span>'+
      '<button class="star '+on+'" data-url="'+esc(l.url)+'" title="Pin to Most Used">'+sym+'</button></a>';
  }

  function buildSection(sec, matches, extraClass){
    var wrap = document.createElement('div');
    wrap.className = 'section' + (collapsed.has(sec.section) ? ' collapsed' : '') + (extraClass ? ' '+extraClass : '');
    var title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = '<span class="em">'+sec.em+'</span> '+sec.section+' <span class="count">'+matches.length+'</span><span class="chev">▼</span>';
    title.addEventListener('click', function(){
      if (collapsed.has(sec.section)) collapsed.delete(sec.section); else collapsed.add(sec.section);
      render();
    });
    wrap.appendChild(title);
    var grid = document.createElement('div');
    grid.className = 'grid';
    grid.innerHTML = matches.map(cardHTML).join('');
    wrap.appendChild(grid);
    return wrap;
  }

  function renderBrowse(f){
    var anyShown = false;
    var starredLinks = Array.from(starred).map(function(u){ return allLinks[u]; }).filter(Boolean).filter(function(l){ return l.name.toLowerCase().indexOf(f) > -1; });
    if (starred.size){
      if (starredLinks.length){ content.appendChild(buildSection({section:"Most Used", em:"⭐"}, starredLinks, 'mostused')); anyShown = true; }
    } else if (f === "" && activeFilter === "all"){
      var wrap = document.createElement('div');
      wrap.className = 'section mostused';
      wrap.innerHTML = '<div class="section-title"><span class="em">⭐</span> Most Used <span class="chev">&nbsp;</span></div><div class="mostused-empty">Tap the ☆ star on any tile to pin your most-used links here.</div>';
      content.appendChild(wrap);
    }
    data.forEach(function(sec){
      if (activeFilter !== "all" && sec.cat !== activeFilter) return;
      var matches = sec.links.filter(function(l){ return l.name.toLowerCase().indexOf(f) > -1; });
      if (!matches.length) return;
      anyShown = true;
      content.appendChild(buildSection(sec, matches));
    });
    noResults.style.display = anyShown ? 'none' : 'block';
    var starBtns = content.querySelectorAll('.star');
    for (var i=0;i<starBtns.length;i++){
      starBtns[i].addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); toggleStar(this.getAttribute('data-url')); });
    }
  }

  function renderRouter(f){
    var lead = document.createElement('div');
    lead.className = 'router-lead';
    var matches = routes.filter(function(r){
      if (r.want.toLowerCase().indexOf(f) > -1 || r.dest.toLowerCase().indexOf(f) > -1 || r.keys.indexOf(f) > -1) return true;
      return f.split(' ').some(function(w){ return w && (r.want.toLowerCase().indexOf(w) > -1 || r.keys.indexOf(w) > -1); });
    });
    lead.textContent = f ? (matches.length + ' match' + (matches.length===1?'':'es')) : 'Tap what you\u2019re trying to do:';
    content.appendChild(lead);
    matches.forEach(function(r){
      var a = document.createElement('a');
      a.className = 'rrow';
      a.href = r.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.innerHTML = '<span class="ic">'+r.icon+'</span><span class="body"><span class="want">'+r.want+'</span><span class="goes"><span class="arrow">→</span> '+r.dest+'</span></span><span class="chev">›</span>';
      content.appendChild(a);
    });
    noResults.style.display = matches.length ? 'none' : 'block';
  }

  function renderChecklist(){
    noResults.style.display = 'none';

    var dateline = document.createElement('div');
    dateline.className = 'cl-dateline';
    dateline.textContent = new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    content.appendChild(dateline);

    var prog = document.createElement('div');
    prog.className = 'cl-progress';
    prog.innerHTML =
      '<div class="cl-ring"><svg width="56" height="56">'+
      '<circle cx="28" cy="28" r="24" stroke="#e8eef4" stroke-width="6" fill="none"></circle>'+
      '<circle id="clRing" cx="28" cy="28" r="24" stroke="#0a5ca8" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"></circle>'+
      '</svg><span class="pct" id="clPct">0%</span></div>'+
      '<div class="cl-ptxt"><div class="big" id="clBig">Ready to start</div><div class="small" id="clSub">0 of '+clTotal+' tasks complete</div></div>'+
      '<button class="cl-reset" id="clReset">Reset day</button>';
    content.appendChild(prog);

    clSections.forEach(function(sec, si){
      var wrap = document.createElement('div');
      wrap.className = 'cl-section';
      var html = '<h2><span class="em">'+sec.em+'</span> '+sec.title+'<span class="cbadge '+sec.badge+'">'+sec.badge.toUpperCase()+'</span></h2>';
      sec.items.forEach(function(it, ii){
        var id = si+'_'+ii;
        var done = clState[id] ? ' done' : '';
        html += '<div class="cl-item'+done+'" data-id="'+id+'"><span class="cl-cb"></span><span class="cl-txt">'+it.t+'<span class="hint">'+it.h+'</span></span></div>';
      });
      wrap.innerHTML = html;
      content.appendChild(wrap);
    });

    var note = document.createElement('div');
    note.className = 'cl-note';
    note.textContent = 'Your checkmarks save automatically and reset each morning.';
    content.appendChild(note);

    function updateProgress(){
      var done = 0;
      for (var k in clState){ if (clState[k]) done++; }
      var pct = clTotal ? Math.round(done/clTotal*100) : 0;
      document.getElementById('clPct').textContent = pct + '%';
      document.getElementById('clRing').style.strokeDashoffset = 150.8 * (1 - pct/100);
      document.getElementById('clSub').textContent = done + ' of ' + clTotal + ' tasks complete';
      document.getElementById('clBig').textContent = pct===100 ? "All done — great work! 🎉" : (pct>=60 ? "Great progress" : (pct>0 ? "Keep it going" : "Ready to start"));
    }

    var items = content.querySelectorAll('.cl-item');
    for (var i=0;i<items.length;i++){
      items[i].addEventListener('click', function(){
        var id = this.getAttribute('data-id');
        clState[id] = !clState[id];
        this.classList.toggle('done', !!clState[id]);
        store.set(clKey(), clState);
        updateProgress();
      });
    }
    document.getElementById('clReset').addEventListener('click', function(){
      clState = {};
      store.set(clKey(), clState);
      var its = content.querySelectorAll('.cl-item');
      for (var j=0;j<its.length;j++){ its[j].classList.remove('done'); }
      updateProgress();
    });
    updateProgress();
  }

  function render(){
    content.innerHTML = "";
    var f = searchEl.value.trim().toLowerCase();
    if (mode === "browse") renderBrowse(f);
    else if (mode === "router") renderRouter(f);
    else renderChecklist();
  }

  filters.forEach(function(fl){
    var b = document.createElement('button');
    b.className = 'filter' + (fl.key === 'all' ? ' active' : '');
    b.textContent = fl.label;
    b.addEventListener('click', function(){
      activeFilter = fl.key;
      var all = document.querySelectorAll('.filter');
      for (var i=0;i<all.length;i++){ all[i].classList.remove('active'); }
      b.classList.add('active');
      render();
    });
    filtersEl.appendChild(b);
  });

  var mB = document.getElementById('modeBrowse');
  var mR = document.getElementById('modeRouter');
  var mC = document.getElementById('modeChecklist');
  function setMode(m){
    mode = m;
    mB.classList.toggle('active', m==='browse');
    mR.classList.toggle('active', m==='router');
    mC.classList.toggle('active', m==='checklist');
    filtersEl.style.display = (m==='browse') ? 'flex' : 'none';
    searchEl.style.display = (m==='checklist') ? 'none' : 'block';
    if (m==='browse') searchEl.placeholder = '🔍  Search tools and guides…';
    else if (m==='router') searchEl.placeholder = '🔍  Type what you need (e.g. anticoag, letter, copay)…';
    render();
  }
  mB.addEventListener('click', function(){ setMode('browse'); });
  mR.addEventListener('click', function(){ setMode('router'); });
  mC.addEventListener('click', function(){ setMode('checklist'); });

  searchEl.addEventListener('input', render);
  render();
</script>
</body>
</html>
